# fonts.ini: the Bragi UI's type scale.
# "Name = file, size in pixels". Files come from this package's fonts/
# folder (Manrope, OFL: fonts/LICENSE-Manrope.txt), else the GitGud UI's
# (JetBrains Mono). Weights follow the design: 400 body, 600 buttons and
# labels, 700 titles and caps headings.

# Body
Bragi-12        = Manrope-Regular.ttf, 12
Bragi-13        = Manrope-Regular.ttf, 13
Bragi-14        = Manrope-Regular.ttf, 14
Bragi-15        = Manrope-Regular.ttf, 15
Bragi-16        = Manrope-Regular.ttf, 16

# Buttons and labels (600)
Bragi-12-Bold   = Manrope-SemiBold.ttf, 12
Bragi-13-Bold   = Manrope-SemiBold.ttf, 13
Bragi-14-Bold   = Manrope-SemiBold.ttf, 14

# Titles (700)
Bragi-15-Bold   = Manrope-Bold.ttf, 15
Bragi-18-Bold   = Manrope-Bold.ttf, 18
Bragi-20-Bold   = Manrope-Bold.ttf, 20
Bragi-22-Bold   = Manrope-Bold.ttf, 22
Bragi-32-Bold   = Manrope-Bold.ttf, 32

# Rail labels (600) and caps headings (700)
Bragi-Rail      = Manrope-SemiBold.ttf, 11.5
Bragi-Caps      = Manrope-Bold.ttf, 11.5

# Code, paths, branch names
Bragi-Mono-11   = JetBrainsMono-Regular.ttf, 11.5
Bragi-Mono-13   = JetBrainsMono-Regular.ttf, 13
