# dark.ini: the Bragi UI's dark theme.
#
# Two parts (src/ui/ColourMap.h):
#   - named tokens: Bragi's own layouts and scripts write $accent, $panel...
#   - the GitGud UI's Synthwave colours mapped onto the tokens, so the
#     Repository view (the GitGud UI's files) takes this theme unchanged.
# light.ini and dark.ini map the same roles; keep them in step.


# Tokens
bg             = FF1B2A27    # window background, main column
rail           = FF14211F    # icon rail, sidebars, segmented controls, board columns
panel          = FF213330    # cards, composer, dialogs
well           = FF14211F    # inputs, search field
border         = FF35504A    # hairlines and outlines
border-strong  = FF4A6A62    # focused or emphasised outlines
text           = FFECE7D8    # primary text
sub            = FFB9C2B0    # secondary text, icons
disabled       = FF5E716B    # disabled text
accent         = FFE8B866    # primary buttons, mic, badges
accent-hover   = FFF0CB86    # primary button hover
accent-pressed = FFD9A64F    # primary button pressed
on-accent      = FF2A1E05    # text and icons on accent
accent-text    = FFE8B866    # active rail item, highlighted names
link           = FFE8B866    # links, secondary actions
add            = FFA9BA78    # additions, server up
warn           = FFE09A6A    # deletions, bugs, warnings
err            = FFEB8A5C    # errors, conflicts
sel            = FF2A3F3B    # selection, active item, user bubble
hover          = FF233733    # row and button hover
petal          = FFE8B866    # logo petals
logo-centre    = FF6B4A16    # logo centre
add-bg         = 29A9BA78    # added diff lines
del-bg         = 29E09A6A    # deleted diff lines
code-bg        = FF14211F    # code blocks
code-text      = FFECE7D8    # code block text
code-link      = FFE8B866    # links in code blocks
shade          = A6081210    # behind modal dialogs
text-select    = 59E8B866    # selected text in a conversation, over it
plan-done      = FFA9BA78    # the plan box: a finished step's check
plan-active    = FFE8B866    # the plan box: the step being worked on
plan-pending   = FF6E857E    # the plan box: a step not started

