# light.ini: the Bragi UI's light theme.
#
# Two parts (src/ui/ColourMap.h):
#   - named tokens: Bragi's own layouts and scripts write $accent, $panel...
#   - the GitGud UI's Synthwave colours mapped onto the tokens, so the
#     Repository view (the GitGud UI's files) takes this theme unchanged.
# light.ini and dark.ini map the same roles; keep them in step.


# Tokens
bg             = FFEDEEDF    # window background, main column
rail           = FFE2E5D2    # icon rail, sidebars, segmented controls, board columns
panel          = FFF7F7EC    # cards, composer, dialogs
well           = FFFFFFFA    # inputs, search field
border         = FFCDD3BC    # hairlines and outlines
border-strong  = FFB5BDA3    # focused or emphasised outlines
text           = FF1F3B36    # primary text
sub            = FF4C645C    # secondary text, icons
disabled       = FF9AA595    # disabled text
accent         = FFE3A83A    # primary buttons, mic, badges
accent-hover   = FFEDBC5C    # primary button hover
accent-pressed = FFCC9228    # primary button pressed
on-accent      = FF2A1E05    # text and icons on accent
accent-text    = FF8A5A12    # active rail item, highlighted names
link           = FF1F6B62    # links, secondary actions
add            = FF55692A    # additions, server up
warn           = FFB5582A    # deletions, bugs, warnings
err            = FFA8401E    # errors, conflicts
sel            = FFD8DCC6    # selection, active item, user bubble
hover          = FFE5E8D6    # row and button hover
petal          = FFE3A83A    # logo petals
logo-centre    = FF6B4A16    # logo centre
add-bg         = FFE3EBC8    # added diff lines
del-bg         = FFF6DFCB    # deleted diff lines
code-bg        = FF1F3B36    # code blocks
code-text      = FFEDEEDF    # code block text
code-link      = FFEDBC5C    # links in code blocks
shade          = 661F3B36    # behind modal dialogs
text-select    = 4DE3A83A    # selected text in a conversation, over it
plan-done      = FF55692A    # the plan box: a finished step's check
plan-active    = FFCC9228    # the plan box: the step being worked on
plan-pending   = FF9AA595    # the plan box: a step not started

