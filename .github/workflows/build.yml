# Builds, tests, and packages GitGud Desktop on every push and pull request.
# Every run keeps the zip, the installer, and the update files as the
# GitGud-win64 artifact, and the .deb and .rpm as GitGud-linux; pushing a tag
# like v1.0 also publishes a release with all of them. Installed Windows
# copies update themselves from a release's update files (update-manifest.txt,
# signed with the GITGUD_UPDATE_SIGNING_KEY secret, and GitGud-win64.pack);
# Linux packages are updated by the package manager.
#
# The first run builds every vcpkg dependency (OpenSSL among them) and CEGUI,
# which takes a while; both are cached, so later runs only build the app.
name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # Software OpenGL for the smoke test (the runners have no GPU).
  MESA_VERSION: "26.2.2"
  # Inno Setup builds the installer: this release of jrsoftware/issrc, checked
  # against the SHA-256 GitHub lists for its x64 installer. Update both together.
  INNO_VERSION: "7.0.2"
  INNO_SHA256: "5ad54ca3def786f8f4212552e54cc6d8d61329e2d24a1cfee0571d42c2684ff1"

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 150
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Cache keys
        id: keys
        run: |
          $baseline = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          $cegui = (git ls-tree HEAD third_party/cegui).Split()[2]
          "baseline=$baseline" >> $env:GITHUB_OUTPUT
          "cegui=$cegui" >> $env:GITHUB_OUTPUT
          "image=$env:ImageOS-$env:ImageVersion" >> $env:GITHUB_OUTPUT

      # vcpkg at the manifests' baseline (setup.ps1 keeps this VCPKG_ROOT
      # rather than Visual Studio's own copy).
      - name: vcpkg
        run: |
          $root = Join-Path $env:RUNNER_TEMP "vcpkg"
          git clone --quiet https://github.com/microsoft/vcpkg $root
          git -C $root checkout --quiet ${{ steps.keys.outputs.baseline }}
          & (Join-Path $root "bootstrap-vcpkg.bat") -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $cache = Join-Path $env:RUNNER_TEMP "vcpkg-binaries"
          New-Item -ItemType Directory -Force $cache | Out-Null
          "VCPKG_ROOT=$root" >> $env:GITHUB_ENV
          "VCPKG_BINARY_SOURCES=clear;files,$cache,readwrite" >> $env:GITHUB_ENV

      # Restored and saved as separate steps so a failure later in the job
      # still keeps whatever was built.
      - name: Restore vcpkg packages
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/vcpkg-binaries
          key: vcpkg-${{ steps.keys.outputs.image }}-${{ steps.keys.outputs.baseline }}-${{ hashFiles('vcpkg.json', 'third_party/cegui-manifest/vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ steps.keys.outputs.image }}-${{ steps.keys.outputs.baseline }}-

      - name: Restore CEGUI
        id: cegui-cache
        uses: actions/cache/restore@v6
        with:
          path: third_party/cegui-install-release
          key: cegui-${{ steps.keys.outputs.image }}-${{ steps.keys.outputs.cegui }}-${{ hashFiles('third_party/patches/cegui/*.patch', 'third_party/cegui-manifest/vcpkg.json', 'setup.ps1') }}

      - name: Build and test
        run: |
          $log = Join-Path $env:RUNNER_TEMP "setup.log"
          powershell -NoProfile -ExecutionPolicy Bypass -File setup.ps1 -Preset release -Test *>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) {
            $tail = (Get-Content $log -Tail 60) -join "`n"
            "::error title=Build and test failed::$($tail -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A')"
            exit 1
          }

      - name: Save vcpkg packages
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/vcpkg-binaries
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Save CEGUI
        if: always() && steps.cegui-cache.outputs.cache-hit != 'true' && hashFiles('third_party/cegui-install-release/.gitgud-stamp') != ''
        uses: actions/cache/save@v6
        with:
          path: third_party/cegui-install-release
          key: ${{ steps.cegui-cache.outputs.cache-primary-key }}

      - name: Software OpenGL for the smoke test
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "mesa.7z"
          $out = Join-Path $env:RUNNER_TEMP "mesa-gl"
          Invoke-WebRequest "https://github.com/pal1000/mesa-dist-win/releases/download/$env:MESA_VERSION/mesa3d-$env:MESA_VERSION-release-msvc.7z" -OutFile $archive
          7z e -y -bso0 $archive x64/opengl32.dll x64/libgallium_wgl.dll "-o$out"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # Installed into a temp folder put first on PATH, so package.ps1 uses this
      # exact version even if the runner image has another.
      - name: Inno Setup
        run: |
          $tag = "is-" + ($env:INNO_VERSION -replace "\.", "_")
          $setup = Join-Path $env:RUNNER_TEMP "innosetup-$env:INNO_VERSION-x64.exe"
          Invoke-WebRequest "https://github.com/jrsoftware/issrc/releases/download/$tag/innosetup-$env:INNO_VERSION-x64.exe" -OutFile $setup
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash
          if ($hash -ne $env:INNO_SHA256) {
            "::error title=Inno Setup download::SHA-256 mismatch: got $hash"
            exit 1
          }
          $dir = Join-Path $env:RUNNER_TEMP "innosetup"
          $p = Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/CURRENTUSER", "/DIR=`"$dir`"" -Wait -PassThru
          if ($p.ExitCode -ne 0 -or -not (Test-Path (Join-Path $dir "ISCC.exe"))) {
            "::error title=Inno Setup install::the installer exited with $($p.ExitCode)"
            exit 1
          }
          $dir >> $env:GITHUB_PATH

      - name: Package
        env:
          GITGUD_UPDATE_SIGNING_KEY: ${{ secrets.GITGUD_UPDATE_SIGNING_KEY }}
        run: |
          $log = Join-Path $env:RUNNER_TEMP "package.log"
          # A release's update files must be signed; branch builds may not be.
          $signing = @(if ($env:GITHUB_REF -like "refs/tags/v*") { "-RequireSigned" })
          powershell -NoProfile -ExecutionPolicy Bypass -File package.ps1 -SkipBuild -Installer @signing -OpenGLRuntime (Join-Path $env:RUNNER_TEMP "mesa-gl") *>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) {
            $lines = @(Get-Content $log -Tail 30)
            foreach ($extra in @("build/dist/smoke-test/gitgud.log", "build/dist/smoke-test/appdata/Gitgud/logs/CEGUI.log")) {
              if (Test-Path $extra) { $lines += "--- $extra"; $lines += @(Get-Content $extra -Tail 25) }
            }
            $text = $lines -join "`n"
            "::error title=Packaging failed::$($text -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A')"
            exit 1
          }

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: GitGud-win64
          path: |
            build/dist/GitGud-win64.zip
            build/dist/GitGud-win64-setup.exe
            build/dist/GitGud-win64.pack
            build/dist/update-manifest.txt
          if-no-files-found: error
          retention-days: 14

  # Built on the oldest Ubuntu runner so the packages run on any distribution
  # with at least its glibc (2.35: Ubuntu 22.04+, Debian 12, Fedora 36+).
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # Build tools, the dev headers SDL2 needs (or it drops X11/Wayland
      # support), rpmbuild, and Xvfb + Mesa for the smoke test.
      - name: Packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q build-essential ninja-build pkg-config zip unzip \
            autoconf autoconf-archive automake libtool bison flex python3-venv \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxinerama-dev libxss-dev libxxf86vm-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev libegl1-mesa-dev \
            libgl1-mesa-dev libglu1-mesa-dev libdbus-1-dev libibus-1.0-dev \
            rpm xvfb libgl1-mesa-dri git-lfs gnupg

      - name: Cache keys
        id: keys
        run: |
          echo "baseline=$(jq -r '."builtin-baseline"' vcpkg.json)" >> "$GITHUB_OUTPUT"
          echo "cegui=$(git ls-tree HEAD third_party/cegui | awk '{print $3}')" >> "$GITHUB_OUTPUT"
          echo "image=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"

      - name: vcpkg
        run: |
          root="$RUNNER_TEMP/vcpkg"
          git clone --quiet https://github.com/microsoft/vcpkg "$root"
          git -C "$root" checkout --quiet ${{ steps.keys.outputs.baseline }}
          "$root/bootstrap-vcpkg.sh" -disableMetrics
          mkdir -p "$RUNNER_TEMP/vcpkg-binaries"
          echo "VCPKG_ROOT=$root" >> "$GITHUB_ENV"
          echo "VCPKG_BINARY_SOURCES=clear;files,$RUNNER_TEMP/vcpkg-binaries,readwrite" >> "$GITHUB_ENV"

      - name: Restore vcpkg packages
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/vcpkg-binaries
          key: vcpkg-${{ steps.keys.outputs.image }}-${{ steps.keys.outputs.baseline }}-${{ hashFiles('vcpkg.json', 'third_party/cegui-manifest/vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ steps.keys.outputs.image }}-${{ steps.keys.outputs.baseline }}-

      - name: Restore CEGUI
        id: cegui-cache
        uses: actions/cache/restore@v6
        with:
          path: third_party/cegui-install-release
          key: cegui-${{ steps.keys.outputs.image }}-${{ steps.keys.outputs.cegui }}-${{ hashFiles('third_party/patches/cegui/*.patch', 'third_party/cegui-manifest/vcpkg.json', 'setup.sh') }}

      - name: Build and test
        run: ./setup.sh --preset release --test

      - name: Save vcpkg packages
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/vcpkg-binaries
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Save CEGUI
        if: always() && steps.cegui-cache.outputs.cache-hit != 'true' && hashFiles('third_party/cegui-install-release/.gitgud-stamp') != ''
        uses: actions/cache/save@v6
        with:
          path: third_party/cegui-install-release
          key: ${{ steps.cegui-cache.outputs.cache-primary-key }}

      - name: Package
        run: ./package.sh --skip-build

      # Install the .deb and start the installed app under Xvfb (Mesa's
      # software OpenGL) with a script that closes it once the UI is up.
      - name: Smoke test
        run: |
          sudo apt-get install -y -q ./build/dist/gitgud-desktop_*_amd64.deb
          scratch="$RUNNER_TEMP/smoke"
          mkdir -p "$scratch/home"
          echo 'gitgud.after(3000, function() print("[smoke] ui up") gitgud.emit("window.close", "") end)' > "$scratch/smoke.lua"
          HOME="$scratch/home" XDG_CONFIG_HOME="$scratch/config" GITGUD_UI=default \
            GITGUD_SCRIPT="$scratch/smoke.lua" GITGUD_LOG="$scratch/gitgud.log" \
            timeout 120 xvfb-run -a -s "-screen 0 1600x1000x24" gitgud || true
          if ! grep -q "\[smoke\] ui up" "$scratch/gitgud.log"; then
            echo "::error title=Smoke test::the installed app didn't start"
            tail -30 "$scratch/gitgud.log" || true
            tail -30 "$scratch/config/gitgud/logs/CEGUI.log" || true
            exit 1
          fi
          /usr/lib/gitgud/gh/gh --version

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: GitGud-linux
          path: |
            build/dist/*.deb
            build/dist/*.rpm
          if-no-files-found: error
          retention-days: 14

  # Apple Silicon, macOS 12 and later (see triplets/arm64-osx.cmake).
  macos:
    runs-on: macos-15
    timeout-minutes: 150
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Packages
        run: brew install ninja pkg-config

      - name: Cache keys
        id: keys
        run: |
          echo "baseline=$(jq -r '."builtin-baseline"' vcpkg.json)" >> "$GITHUB_OUTPUT"
          echo "cegui=$(git ls-tree HEAD third_party/cegui | awk '{print $3}')" >> "$GITHUB_OUTPUT"
          echo "image=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"

      - name: vcpkg
        run: |
          root="$RUNNER_TEMP/vcpkg"
          git clone --quiet https://github.com/microsoft/vcpkg "$root"
          git -C "$root" checkout --quiet ${{ steps.keys.outputs.baseline }}
          "$root/bootstrap-vcpkg.sh" -disableMetrics
          mkdir -p "$RUNNER_TEMP/vcpkg-binaries"
          echo "VCPKG_ROOT=$root" >> "$GITHUB_ENV"
          echo "VCPKG_BINARY_SOURCES=clear;files,$RUNNER_TEMP/vcpkg-binaries,readwrite" >> "$GITHUB_ENV"

      - name: Restore vcpkg packages
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/vcpkg-binaries
          key: vcpkg-${{ steps.keys.outputs.image }}-${{ steps.keys.outputs.baseline }}-${{ hashFiles('vcpkg.json', 'third_party/cegui-manifest/vcpkg.json', 'triplets/*.cmake') }}
          restore-keys: |
            vcpkg-${{ steps.keys.outputs.image }}-${{ steps.keys.outputs.baseline }}-

      - name: Restore CEGUI
        id: cegui-cache
        uses: actions/cache/restore@v6
        with:
          path: third_party/cegui-install-release
          key: cegui-${{ steps.keys.outputs.image }}-${{ steps.keys.outputs.cegui }}-${{ hashFiles('third_party/patches/cegui/*.patch', 'third_party/cegui-manifest/vcpkg.json', 'triplets/*.cmake', 'setup.sh') }}

      # On failure, carry on compiling past the first error and list every
      # one, and always list warnings in GitGud's own sources.
      - name: Build and test
        run: |
          log="$RUNNER_TEMP/setup.log"
          set +e
          ./setup.sh --preset release --test 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            for dir in build/cegui-rel build/release; do
              [ -f "$dir/build.ninja" ] && ninja -C "$dir" -k 0 >> "$log" 2>&1
            done
            echo "--- errors"
            grep -E "error:|Undefined symbols|ld: " "$log" | sort -u | head -80
          fi
          echo "--- warnings in src/"
          grep -E "/src/[^ ]*: warning:" "$log" | grep -v third_party | sort -u | head -80
          exit $status

      - name: Save vcpkg packages
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/vcpkg-binaries
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Save CEGUI
        if: always() && steps.cegui-cache.outputs.cache-hit != 'true' && hashFiles('third_party/cegui-install-release/.gitgud-stamp') != ''
        uses: actions/cache/save@v6
        with:
          path: third_party/cegui-install-release
          key: ${{ steps.cegui-cache.outputs.cache-primary-key }}

  # A tag publishes one release with every platform's files.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "GitGud Desktop $version" --generate-notes
